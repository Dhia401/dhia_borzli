<h3>Zone de notifications</h3>
<p>
    Vous avez {{notifList.length}} notifications.
</p>

<button (click)="ShowNotifications()">{{btnText}}</button>
@if (show) {
    <div>
        <ul>
            @for (item of notifList; track $index) {
                <li>
                    {{item.message}}
            </li>
        }
    </ul>
    </div>
}
